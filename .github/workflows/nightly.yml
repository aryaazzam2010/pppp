name: Build YD-RP2040
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential python3 git

      - name: Configure and Build YD-RP2040
        run: |
          git submodule update --init --recursive
          cd pico-sdk && git submodule update --init --recursive && cd ..
          mkdir -p build && cd build
          cmake .. -DPICO_BOARD=pico \
                   -DPICO_SDK_PATH=../pico-sdk \
                   -DPICO_USE_FASTEST_SUPPORTED_CLOCK=0 \
                   -DPICO_FLASH_SIZE_LIMIT_BYTES=2097152 \
                   -DLED_GPIO=23 \
                   -DLED_DRIVER=WS2812 \
                   -DBUTTON_GPIO=24
          make -j$(nproc)

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_fido_yd_rp2040
          path: build/*.uf2
